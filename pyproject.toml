[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patale-fund"
version = "0.1.0"
description = "Laboratoire de paper trading open source, simulation uniquement"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.2.1", "pandas==2.2.3", "alpaca-py==0.38.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.6"]

[tool.setuptools.packages.find]
include = ["fond*"]

[tool.pytest.ini_options]
addopts = "--cov=fond --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
